name: 360T6GS

on: 
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      build_variant: ${{ matrix.build_variant }}
      targets: ${{ matrix.targets }}
      images_dir: /opt/images
    strategy:
      matrix:
        include:
          - build_variant: "mt7621"
            targets: "360-T6GS"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext libltdl-dev

      - name: Inject Random MAC into board.h
        run: |
          GEN_MAC() {
              printf '02:%02X:%02X:%02X:%02X:%02X' \
                  $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256))
          }
          
          MAC_MAIN=$(GEN_MAC)
          MAC_24G=$(GEN_MAC)
          MAC_5G=$(GEN_MAC)
          
          echo "Generated MACs for this build:"
          echo "Main MAC: $MAC_MAIN"
          echo "2.4G MAC: $MAC_24G"
          echo "5G MAC:   $MAC_5G"
          
          BOARD_HEADER="trunk/configs/boards/360-T6GS/board.h"
          echo "" >> $BOARD_HEADER
          echo "/* Auto Generated Random MACs */" >> $BOARD_HEADER
          echo "#define BOARD_CONFIG_DEFAULT_MAC \"$MAC_MAIN\"" >> $BOARD_HEADER
          echo "#define BOARD_CONFIG_WIFI_MAC_OFFSET 1" >> $BOARD_HEADER
          echo "#define BOARD_CONFIG_WIFI2_MAC \"$MAC_24G\"" >> $BOARD_HEADER
          echo "#define BOARD_CONFIG_WIFI5_MAC \"$MAC_5G\"" >> $BOARD_HEADER

      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          ./clear_tree >/dev/null 2>&1 || true
          for m in $targets; do fakeroot ./build_firmware_ci $m; \
          if [ $? = 0 ]; then cp -f images/*.trx ${images_dir}/$m.trx; else exit 1; fi; \
          ./clear_tree_simple >/dev/null 2>&1; done

      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${build_variant}_${GIT_VERSION} || image_name=images_${build_variant}
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV

      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z

      - name: Upload firmware to WeTransfer
        continue-on-error: true
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress /opt/images/*.trx 2>&1 | tee wetransfer.log
          echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
